<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="color-scheme" content="light dark" />
    <meta name="application-name" content="ots.ashref.tn" />
    <meta name="author" content="ashref.tn" />
    <meta name="robots" content="index,follow,max-image-preview:large" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="ots.ashref.tn" />
    <meta
      name="keywords"
      content="one-time secret, secure sharing, encrypted secret link, client-side encryption, ephemeral message, burn after read, ots.ashref.tn"
    />
    <meta
      name="description"
      content="Share sensitive information securely with one-time encrypted links. Client-side encryption, optional passphrase, and automatic burn-after-read."
    />
    <link rel="canonical" href="https://ots.ashref.tn/" />

    <meta property="og:title" content="ots.ashref.tn | Secure One-Time Secret Sharing" />
    <meta
      property="og:description"
      content="Create encrypted one-time links for secrets with burn-after-read and optional passphrase protection."
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://ots.ashref.tn/" />
    <meta property="og:image" content="https://ots.ashref.tn/og.png" />
    <meta property="og:image:secure_url" content="https://ots.ashref.tn/og.png" />
    <meta property="og:image:alt" content="ots.ashref.tn secure one-time secret sharing preview" />
    <meta property="og:image:type" content="image/png" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ots.ashref.tn | Secure One-Time Secret Sharing" />

      name="twitter:description"
      content="Create encrypted one-time secret links with automatic burn-after-read and passphrase protection."
    />
    <meta name="twitter:image" content="https://ots.ashref.tn/og.png" />
    <meta name="twitter:image:alt" content="ots.ashref.tn secure one-time secret sharing preview" />

    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f7fc" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#090b14" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <title>ots.ashref.tn | Secure One-Time Secret Sharing</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "ots.ashref.tn",
        "url": "https://ots.ashref.tn/",
        "description": "Secure one-time secret sharing with client-side encryption and automatic burn-after-read.",
        "inLanguage": "en"
      }
    </script>
    <script>
      (() => {
        const s = localStorage.getItem('theme');
        const m = s || 'system';
        const active = m === 'system'
          ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : m;
        document.documentElement.setAttribute('data-theme', active);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
